<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ORBIT store assets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --white: #ffffff;
        --surface: #f5f5f7;
        --ink: #1d1d1f;
        --muted: #6e6e73;
        --hairline: rgba(0, 0, 0, 0.08);
        --accent: #5a9bff;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        background: var(--white);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        color: var(--ink);
        overflow: hidden;
      }

      .slide {
        position: relative;
        width: 1280px;
        height: 800px;
        background: var(--white);
        overflow: hidden;
      }

      .eyebrow {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        font-size: 60px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.06;
        text-wrap: balance;
      }

      .sub {
        margin-top: 18px;
        font-size: 21px;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1.4;
        color: var(--muted);
        text-wrap: balance;
      }

      /*
       * The product is the panel, so the panel is the only object on the slide:
       * a dark rounded card with a rim and a wide, soft shadow. No browser
       * chrome, because a fake toolbar reads as decoration and steals the eye
       * from the UI it is meant to frame.
       */
      .panel {
        position: relative;
        border-radius: 18px;
        background: #0b0d12;
        overflow: hidden;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.09),
          0 0 0 1px rgba(0, 0, 0, 0.06),
          0 2px 4px rgba(0, 0, 0, 0.02),
          0 12px 24px rgba(0, 0, 0, 0.05),
          0 32px 64px -12px rgba(0, 0, 0, 0.12);
      }

      .panel img { display: block; width: 100%; }

      /* Running off an edge: the panel fades out rather than being sliced. */
      .bleed-b { -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); mask-image: linear-gradient(to bottom, #000 82%, transparent 100%); }
      .bleed-r { -webkit-mask-image: linear-gradient(to right, #000 88%, transparent 100%); mask-image: linear-gradient(to right, #000 88%, transparent 100%); }

      .crop { overflow: hidden; }

      .card {
        background: var(--surface);
        border-radius: 22px;
        overflow: hidden;
      }

      .center { display: flex; flex-direction: column; align-items: center; text-align: center; }

      .marks { margin-top: 8px; font-size: 14px; color: var(--muted); letter-spacing: -0.005em; }

      .orb {
        width: 26px; height: 26px; border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #a8c8ff 0%, #5a9bff 42%, #2f5fd0 100%);
        box-shadow: 0 0 0 1px rgba(90, 155, 255, 0.25), 0 6px 14px -6px rgba(90, 155, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const shot = params.get('s') ?? 'hero';
      const raw = params.get('raw') ?? 'raw';

      /** A panel, clipped to `height`, anchored at the top. */
      const PANEL = (src, { width, height, offset = 0, bleed = '' } = {}) => `
        <div class="panel ${bleed}" style="width:${width}px">
          <div class="crop" style="height:${height}px">
            <img src="${raw}/${src}.png" style="margin-top:${-offset}px" alt="" />
          </div>
        </div>`;

      const SLIDES = {
        // 1 · hero: the greeting. Type centred, the panel oversized off the floor.
        hero: () => `
          <div class="slide center" style="padding-top:82px">
            <div class="eyebrow">ORBIT · Browser agent</div>
            <h1 style="margin-top:18px;max-width:660px">Say what you need.</h1>
            <p class="sub" style="max-width:500px">It reads the page, does the clicking and answers. You keep the tab.</p>
            <div style="margin-top:40px">
              ${PANEL('home', { width: 620, height: 530, offset: 806 })}
            </div>
          </div>`,

        // 2 · split: a run that was closed and picked up again. Panel on the left.
        split: () => `
          <div class="slide" style="display:flex;align-items:center">
            <div style="position:absolute;left:44px;top:34px">
              ${PANEL('running', { width: 540, height: 760, offset: 580 })}
            </div>
            <div style="position:absolute;left:656px;top:238px;width:540px">
              <div class="eyebrow">Resumable</div>
              <h1 style="margin-top:16px;font-size:56px">Close the panel.<br />Nothing is lost.</h1>
              <p class="sub" style="max-width:440px">Every action is checkpointed. Open it again and the run continues from the step it stopped on.</p>
            </div>
          </div>`,

        // 3 · the reasoning, opened. Panel on the right this time.
        trace: () => `
          <div class="slide" style="display:flex;align-items:center">
            <div style="position:absolute;left:96px;top:246px;width:470px">
              <div class="eyebrow">Every step, on the record</div>
              <h1 style="margin-top:16px;font-size:56px">Ask why it<br />clicked that.</h1>
              <p class="sub" style="max-width:390px">Open any step for the reasoning, the result and exactly what the page returned.</p>
            </div>
            <div style="position:absolute;left:612px;top:20px">
              ${PANEL('step-open', { width: 560, height: 780, offset: 40 })}
            </div>
          </div>`,

        // 4 · bento: the verdict and the evidence, two crops, bleeding off the floor.
        bento: () => `
          <div class="slide" style="padding:64px 96px 0">
            <div class="eyebrow">One thread, all the way</div>
            <h1 style="margin-top:12px;font-size:52px">A verdict, then the evidence.</h1>
            <div style="display:flex;gap:24px;margin-top:30px">
              <div class="card" style="width:520px;height:480px;padding:14px 14px 0">
                <div class="panel" style="border-radius:12px">
                  <div class="crop" style="height:452px">
                    <img src="${raw}/answer.png" style="margin-top:-40px" alt="" />
                  </div>
                </div>
              </div>
              <div class="card" style="width:520px;height:620px;padding:14px 14px 0">
                <div class="panel" style="border-radius:12px">
                  <div class="crop" style="height:592px">
                    <img src="${raw}/rich.png" style="margin-top:-650px" alt="" />
                  </div>
                </div>
              </div>
            </div>
          </div>`,

        // 5 · trust: no product UI at all.
        trust: () => `
          <div class="slide center" style="justify-content:center;padding:0 150px">
            <div class="orb" aria-hidden="true"></div>
            <h1 style="margin-top:26px;max-width:720px">Your key. Your tab.<br />Nothing in between.</h1>
            <p class="sub" style="max-width:560px">No account, no ORBIT server, no telemetry. Page content goes from this browser straight to the model provider you chose.</p>
            <div style="display:flex;gap:64px;margin-top:60px;text-align:left">
              <div><div style="font-size:18px;font-weight:600">Bring your own model</div><div class="marks">OpenAI, Anthropic, Gemini, DeepSeek</div></div>
              <div><div style="font-size:18px;font-weight:600">Nothing leaves your tab</div><div class="marks">One provider, your key, no relay</div></div>
              <div><div style="font-size:18px;font-weight:600">MIT licensed</div><div class="marks">Read every line before you install</div></div>
            </div>
          </div>`,

        // promo small: 440 x 280
        'promo-small': () => `
          <div style="width:440px;height:280px;background:var(--white);position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif">
            <div style="position:absolute;left:30px;top:40px">
              <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)">ORBIT</div>
              <div style="margin-top:10px;font-size:32px;font-weight:700;letter-spacing:-.035em;line-height:1.05;color:var(--ink)">Say what<br />you need.</div>
              <div style="margin-top:12px;font-size:13px;color:var(--muted);letter-spacing:-.005em">Browser agent, in your side panel.</div>
            </div>
            <div style="position:absolute;right:-40px;top:64px;width:200px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 0 0 1px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.02),0 12px 24px rgba(0,0,0,.05),0 32px 64px -12px rgba(0,0,0,.12)">
              <img src="${raw}/answer.png" style="width:100%;display:block" alt="" />
            </div>
          </div>`,

        // promo marquee: 1400 x 560
        'promo-marquee': () => `
          <div style="width:1400px;height:560px;background:var(--white);position:relative;overflow:hidden;display:flex;align-items:center">
            <div style="width:640px;padding-left:96px">
              <div style="font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)">ORBIT · Browser agent</div>
              <div style="margin-top:18px;font-size:62px;font-weight:700;letter-spacing:-.035em;line-height:1.06;color:var(--ink)">Say what<br />you need.</div>
              <div style="margin-top:20px;font-size:21px;color:var(--muted);letter-spacing:-.01em;max-width:440px">It reads the page, does the clicking and answers. Bring your own model.</div>
            </div>
            <div style="position:absolute;left:690px;top:54px;width:520px;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 0 0 1px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.02),0 12px 24px rgba(0,0,0,.05),0 32px 64px -12px rgba(0,0,0,.12)">
              <img src="${raw}/rich.png" style="width:100%;display:block" alt="" />
            </div>
          </div>`,
      };

      document.getElementById('root').innerHTML = (SLIDES[shot] ?? SLIDES.hero)();
      document.fonts.ready.then(() => {
        window.__ready = true;
      });
    </script>
  </body>
</html>
